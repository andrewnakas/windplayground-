# Rasp & Thuerey (2021) direct 3-day model -- the exact recipe, not an
# adaptation. This is the fidelity gate for the whole reproduction: it should
# land near their ERA5-only z500 of 314 at 72h, scored on 2017-2018. Only once
# it does is CMIP6 pretraining (their 268) worth the 154 GB download.
#
# Everything here is from arXiv 2008.08626v2 section 2.2. Deviating from any of
# it means the number is no longer comparable to theirs.
run_name: rt2021_72h
data:
  variable_set: rt2021     # 38 fields/frame -> 117 conv inputs with 3 statics
  train_years: [1979, 2015]
  val_years: [2016, 2016]
  test_years: [2017, 2018]
model:
  name: rt_resnet
  n_frames: 3              # t, t-6h, t-12h
train:
  batch_size: 32
  lr: 5.0e-5
  weight_decay: 1.0e-5     # true L2 on conv kernels only (optimizer: adam)
  optimizer: adam
  lr_schedule: plateau
  plateau_factor: 0.2      # x1/5
  plateau_patience: 2
  max_lr_drops: 2
  early_stop_patience: 5
  warmup_steps: 0          # the paper uses none
  max_steps: 200000        # a ceiling; early stopping is what ends the run
  val_every: 2000
  direct_lead_h: 72

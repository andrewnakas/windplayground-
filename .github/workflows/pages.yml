name: Deploy site to GitHub Pages

# Why this workflow lives on main, not on gh-pages:
# Pages "Source" is set to GitHub Actions, and the auto-created `github-pages`
# environment only accepts deployments whose ref is the repository's DEFAULT
# branch. An identical workflow committed to gh-pages is rejected before its
# first step runs (it fails in ~2s with no step output), which is exactly what
# happened on 2026-08-05. Keeping it here, on the default branch, is what makes
# the deployment authorized.
#
# The published site is the contents of docs/, built by scripts/build_site.py.
# Regenerate with `python scripts/build_site.py` and push docs/ to main.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Supersede a queued deploy with a newer one, but never cancel a deployment
# that is already mid-flight -- a half-applied Pages deploy serves a broken site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

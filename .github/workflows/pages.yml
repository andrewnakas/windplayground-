# Publishes the built site on this branch to GitHub Pages.
#
# The repo's Pages source is set to "GitHub Actions", which publishes nothing
# on its own -- it needs a workflow. This branch already holds the built site
# at its root (produced by scripts/build_site.py and split out of docs/), so
# the job just uploads it as-is.
name: Deploy Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a running deploy finish rather than cancelling it mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

# Publishes the built site on this branch to GitHub Pages.
#
# NOTE: this only works if the `github-pages` environment allows deployments
# from this branch. GitHub auto-creates that environment restricted to the
# DEFAULT branch, so a run from gh-pages fails in ~2 seconds before any step
# executes. Two ways to make Pages work:
#
#   1. (simplest, no Actions needed) Settings > Pages > Source:
#      "Deploy from a branch" > gh-pages > / (root)
#   2. Settings > Environments > github-pages > Deployment branches:
#      add `gh-pages`, then run this workflow.
#
# Left as manual-only so it does not fail on every push to this branch.
name: Deploy Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

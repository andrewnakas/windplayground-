# Refresh live wind and deploy the site -- the ONLY deploy path.
#
# Live data is not committed: every run fetches the newest cycles (dynamical
# .org zarrs, the NOAA HRRR AWS archive, ECMWF open data), blends, rebuilds,
# and ships everything in the Pages artifact. Pushes to main (code, hindcast
# data, the Mac's WeatherNext export) trigger the same full refresh, so the
# deployed site is never older than the newest available data.
#
# Inherited from the retired pages.yml, learned the hard way: this workflow
# must live on the DEFAULT branch -- the github-pages environment rejects
# deployments from any other ref before the first step runs -- and it must
# have no `paths:` filter, which once silently skipped a 252-file deploy.
name: Refresh live wind

on:
  schedule:
    - cron: '20 2,8,14,20 * * *'   # ~2 h after the 00/06/12/18Z cycles
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: live-wind
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          # zarr>=3 is required for dynamical.org's Zarr v3 / Icechunk store and
          # conflicts with the training env's pinned zarr<3, which is why this
          # is a standalone install rather than the project's own environment.
          python -m pip install --quiet "zarr>=3" "xarray>=2025.1" numpy aiohttp fsspec pandas pyyaml scipy ecmwf-opendata cfgrib eccodes

      - name: Fetch live forecasts
        run: |
          set -e
          for ds in aifs gfs; do
            for level in 10m 100m; do
              echo "::group::$ds $level"
              # One source failing (an upstream outage, a partial store) must not
              # discard the others; the previous JSON simply stays in place.
              python scripts/fetch_dynamical.py --dataset "$ds" --level "$level" \
                || echo "$ds $level failed, keeping previous data"
              echo "::endgroup::"
            done
          done
          for level in 10m 80m; do
            echo "::group::hrrr $level"
            python scripts/fetch_dynamical.py --dataset hrrr --level "$level" \
              || echo "hrrr $level failed, keeping previous data"
            echo "::endgroup::"
          done
          echo "::group::hrrr pressure levels"
          python scripts/fetch_hrrr_levels.py || echo "hrrr levels failed"
          echo "::endgroup::"
          for m in aifs ifs; do
            echo "::group::ecmwf open data $m"
            python scripts/fetch_ecmwf_open.py --model "$m" \
              --levels 925 850 700 500 300 250 200 || echo "ecmwf $m failed"
            echo "::endgroup::"
          done

      - name: Blend the live members
        run: |
          # Deliberately NOT `|| true`. The blend refuses to average members
          # from different init times, and that refusal is the point: if one
          # fetch above failed, its previous-cycle file is still on disk and
          # looks valid. A failure here means "the members disagree", which
          # should be visible in the run, not swallowed. The previous blend
          # JSON stays in place either way, so the site keeps working.
          python scripts/blend_live.py

      - name: Rebuild site
        # PYTHONPATH rather than `pip install -e .`: the package pins zarr<3,
        # which is exactly what the fetch step above cannot have. build_site.py
        # only needs windml.config, so putting src/ on the path imports it
        # without dragging in torch or downgrading zarr.
        run: PYTHONPATH=src python scripts/build_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
